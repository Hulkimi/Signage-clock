
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Digital Signage Flip Clock</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #279CF5;
    color: #f8fafc;
    font-family: Arial, Helvetica, sans-serif;
  }
  .screen {
    width: 100vw;
    height: 100vh;
    min-width: 1920px;
    min-height: 1080px;
    position: relative;
    background: #279CF5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .clock {
    display: flex;
    align-items: center;
    gap: 20px;
  }
  
  .flip-unit {
    display: flex;
    gap: 4px;
  }

  .flip-card {
    position: relative;
    width: 140px;
    height: 240px;
    font-size: 150px;
    font-weight: 500;
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #1e2229;
    color: #f1f3f5;
    border-radius: 12px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.2);
    perspective: 400px;
    user-select: none;
  }

  .upper, .lower, .fold-card {
    position: absolute;
    left: 0;
    width: 100%;
    height: 50%;
    overflow: hidden;
    display: flex;
    justify-content: center;
  }

  .upper, .fold-card {
    top: 0;
    align-items: flex-end;
    background: #161920;
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    border-bottom: 1px solid rgba(0,0,0,0.4);
  }

  .lower {
    bottom: 0;
    align-items: flex-start;
    background: #1e2229;
    border-bottom-left-radius: 12px;
    border-bottom-right-radius: 12px;
  }

  .upper span, .lower span, .fold-card span {
    position: absolute;
    height: 240px;
    line-height: 240px;
    width: 100%;
    text-align: center;
  }
  .upper span { top: 0; }
  .lower span { bottom: 0; }
  .fold-card span { top: 0; }

  .fold-card {
    transform-origin: bottom;
    transform-style: preserve-3d;
    z-index: 10;
    display: none;
  }

  .fold-card.fold {
    display: flex;
    animation: flipDown 0.4s ease-in-out forwards;
  }

  @keyframes flipDown {
    0% {
      transform: rotateX(0deg);
    }
    100% {
      transform: rotateX(-180deg);
    }
  }

  .separator {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 30px;
    height: 240px;
    padding: 0 5px;
  }
  .dot {
    width: 12px;
    height: 12px;
    background-color: #1e2229;
    border-radius: 50%;
  }

  .ampm {
    font-size: 100px;
    font-weight: 600;
    letter-spacing: 4px;
    color: #ffffff;
    margin-left: 20px;
    align-self: flex-end;
    margin-bottom: 25px;
  }

  .date {
    margin-top: 50px;
    font-size: 30px;
    font-weight: 400;
    letter-spacing: 5px;
    color: #ffffff;
    text-transform: uppercase;
  }
  .status {
    position: absolute;
    bottom: 42px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 18px;
    letter-spacing: 3px;
    color: #69727d;
    text-transform: uppercase;
  }
  @media (max-width: 1600px) {
    .screen { min-width: 100vw; min-height: 100vh; }
  }
</style>
</head>
<body>
<div class="screen">
  <!-- FLIP CLOCK CONTAINER -->
  <div class="clock" id="clock">
    <!-- Hours -->
    <div class="flip-unit">
      <div class="flip-card" id="h1"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
      <div class="flip-card" id="h2"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
    </div>
    
    <div class="separator" id="sep1">
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Minutes -->
    <div class="flip-unit">
      <div class="flip-card" id="m1"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
      <div class="flip-card" id="m2"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
    </div>
    
    <div class="separator" id="sep2">
      <div class="dot"></div>
      <div class="dot"></div>
    </div>

    <!-- Seconds -->
    <div class="flip-unit" id="seconds-group">
      <div class="flip-card" id="s1"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
      <div class="flip-card" id="s2"><div class="upper"><span>0</span></div><div class="lower"><span>0</span></div><div class="fold-card"><span>0</span></div></div>
    </div>

    <div class="ampm" id="ampm" style="display: none;"></div>
  </div>

  <div class="date" id="date"></div>

</div>

<script>
  let use24Hour = true;   
  let showSeconds = true; 

  const dateEl = document.getElementById("date");
  const ampmEl = document.getElementById("ampm");
  const secondsGroup = document.getElementById("seconds-group");
  const sep2 = document.getElementById("sep2");

  function setDigit(cardId, newVal) {
    const card = document.getElementById(cardId);
    const upper = card.querySelector(".upper span");
    const lower = card.querySelector(".lower span");
    const folder = card.querySelector(".fold-card");
    const folderSpan = folder.querySelector("span");

    const currentVal = upper.textContent;
    if (currentVal === newVal) return;

    folderSpan.textContent = currentVal;
    folder.style.display = "flex";
    folder.classList.remove("fold");
    void folder.offsetWidth; 
    folder.classList.add("fold");

    upper.textContent = newVal;

    setTimeout(() => {
      lower.textContent = newVal;
      folder.style.display = "none";
    }, 400);
  }

  function updateClock() {
    const now = new Date();

    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const seconds = String(now.getSeconds()).padStart(2, "0");

    let ampm = "";
    if (!use24Hour) {
      ampm = hours >= 12 ? "PM" : "AM";
      hours = hours % 12 || 12;
      ampmEl.style.display = "block";
      ampmEl.textContent = ampm;
    } else {
      ampmEl.style.display = "none";
    }

    const hh = String(hours).padStart(2, "0");

    setDigit("h1", hh[0]);
    setDigit("h2", hh[1]);
    setDigit("m1", minutes[0]);
    setDigit("m2", minutes[1]);
    setDigit("s1", seconds[0]);
    setDigit("s2", seconds[1]);

    if (showSeconds) {
      secondsGroup.style.display = "flex";
      sep2.style.display = "flex";
    } else {
      secondsGroup.style.display = "none";
      sep2.style.display = "none";
    }

    dateEl.textContent = now.toLocaleDateString("en-MY", {
      weekday: "long",
      day: "2-digit",
      month: "long",
      year: "numeric"
    });
  }

  // Initialize immediately and start interval loop
  updateClock();
  setInterval(updateClock, 1000);
</script>
</body>
</html>
